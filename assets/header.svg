<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#30363d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#30363d" opacity="0.6"/>
    </pattern>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 36px; fill: #f0f6fc; }
      .mono { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 14px; fill: #58a6ff; }
      .comment { font-family: "JetBrains Mono", "Fira Code", monospace; font-size: 11px; fill: #8b949e; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="160" rx="8" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Technical Grid Pattern -->
  <rect width="900" height="160" rx="8" fill="url(#grid)"/>

  <!-- Terminal Window Controls -->
  <circle cx="28" cy="24" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="24" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="24" r="5" fill="#27c93f"/>
  <text x="80" y="28" class="comment">terminal &mdash; xxnetme/profile</text>

  <line x1="16" y1="42" x2="884" y2="42" stroke="#21262d" stroke-width="1"/>

  <!-- Content -->
  <text x="28" y="94" class="title">timmu</text>
  <text x="28" y="128" class="mono">&gt; TypeScript / client modifications / software tooling<tspan class="cursor">_</tspan></text>
</svg>